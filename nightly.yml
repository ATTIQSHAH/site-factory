name: nightly-site-factory
on:
  schedule: [{cron: "0 21 * * *"}]
  workflow_dispatch:
    inputs:
      max: {description: "Max new leads this run", default: "30"}
permissions: {contents: write}
concurrency: {group: factory}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python factory.py leads/input.csv
        env:
          PAGESPEED_KEY: ${{ secrets.PAGESPEED_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
          MAX_PER_RUN: ${{ github.event.inputs.max || '30' }}
      - name: Save and push sites (triggers Cloudflare deploy)
        run: |
          git config user.name "site-factory"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "new batch" && git push)
      - name: Wait for Cloudflare, then record which links are live
        run: sleep 240 && python check_live.py
      - run: |
          git add -A; git diff --cached --quiet || (git commit -m "live status" && git push)
