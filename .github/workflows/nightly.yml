name: nightly-site-factory
on:
  schedule: [{cron: "0 21 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python factory.py leads/input.csv
        env:
          PAGESPEED_KEY: ${{ secrets.PAGESPEED_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
          MAX_PER_RUN: "30"
      - run: |
          git config user.name "site-factory"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "nightly sites"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}" && exit 0
            sleep 5
          done
          exit 1
