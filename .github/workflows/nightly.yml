name: nightly-site-factory
on:
  # Automatic batches are paused until the single-demo quality gate passes.
  # Keep manual dispatch available for controlled testing only.
  workflow_dispatch:
    inputs:
      max: {description: "Max new leads this run", default: "15"}
permissions: {contents: write}
concurrency: {group: factory}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python factory3.py leads/input.csv
        env:
          PAGESPEED_KEY: ${{ secrets.PAGESPEED_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_DESIGN_MODEL: ${{ vars.OPENROUTER_DESIGN_MODEL }}
          OPENROUTER_DESIGN_FALLBACK_MODEL: ${{ vars.OPENROUTER_DESIGN_FALLBACK_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_DESIGN_MODEL: ${{ vars.GROQ_DESIGN_MODEL }}
          GROQ_VISUAL_MODEL: ${{ vars.GROQ_VISUAL_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DESIGN_MODEL: ${{ vars.CLOUDFLARE_DESIGN_MODEL }}
          CLOUDFLARE_VISUAL_MODEL: ${{ vars.CLOUDFLARE_VISUAL_MODEL }}
          GEMINI_DESIGN_MODEL: gemini-3.8-flash
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VISUAL_MODEL: google/gemma-4-31b-it:free
          OPENROUTER_VISUAL_FALLBACK_MODEL: dots-studio/dots-3-note-preview:free
          OPENROUTER_VISUAL_TERTIARY_MODEL: google/gemma-4-26b-a4b-it:free
          OPENROUTER_VISUAL_QUATERNARY_MODEL: nvidia/nemotron-3.5-super-vl:free
          AI_DESIGN: ${{ vars.AI_DESIGN || '1' }}
          BASE_URL: ${{ vars.BASE_URL }}
          MAX_PER_RUN: ${{ github.event.inputs.max || '15' }}
      - name: Review every new demo before publishing
        run: python review_batch.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_DESIGN_MODEL: ${{ vars.OPENROUTER_DESIGN_MODEL }}
          OPENROUTER_DESIGN_FALLBACK_MODEL: ${{ vars.OPENROUTER_DESIGN_FALLBACK_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_DESIGN_MODEL: ${{ vars.GROQ_DESIGN_MODEL }}
          GROQ_VISUAL_MODEL: ${{ vars.GROQ_VISUAL_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DESIGN_MODEL: ${{ vars.CLOUDFLARE_DESIGN_MODEL }}
          CLOUDFLARE_VISUAL_MODEL: ${{ vars.CLOUDFLARE_VISUAL_MODEL }}
          GEMINI_DESIGN_MODEL: gemini-3.8-flash
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VISUAL_MODEL: google/gemma-4-31b-it:free
          OPENROUTER_VISUAL_FALLBACK_MODEL: dots-studio/dots-3-note-preview:free
          OPENROUTER_VISUAL_TERTIARY_MODEL: google/gemma-4-26b-a4b-it:free
          OPENROUTER_VISUAL_QUATERNARY_MODEL: nvidia/nemotron-3.5-super-vl:free
      - name: Upload demo review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-factory-quality-review
          path: review/batch-*
          if-no-files-found: ignore
          retention-days: 14
      - name: Save and push sites (triggers Cloudflare deploy)
        run: |
          git config user.name "site-factory"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "new batch" && git push)
      - name: Wait for Cloudflare, then record which links are live
        run: sleep 240 && python check_live.py
      - run: |
          git add -A; git diff --cached --quiet || (git commit -m "live status" && git push)
