name: Fluff Bake Bar isolated demo review

on:
  push:
    branches: [production-hardening]
    paths:
      - "factory3.py"
      - "business_intel.py"
      - "template_catalog.py"
      - "site_quality.py"
      - "tests/**"
      - "artdir.py"
      - "media.py"
      - "render3.py"
      - "templates/**"
      - "review_site.py"
      - ".github/workflows/fluff-demo-review.yml"
      - "leads/input.csv"
  pull_request:
    branches: [main]
    paths:
      - "factory3.py"
      - "business_intel.py"
      - "template_catalog.py"
      - "site_quality.py"
      - "tests/**"
      - "artdir.py"
      - "media.py"
      - "render3.py"
      - "templates/**"
      - "review_site.py"
      - ".github/workflows/fluff-demo-review.yml"
      - "leads/input.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Start from a clean isolated demo workspace
        run: rm -rf sites/fluff-bake-bar review/fluff-bake-bar results/fluff-demo-results.csv

      - name: Generate only Fluff Bake Bar
        run: python factory3.py leads/input.csv
        env:
          ONLY_WEBSITE: https://fluffbakebar.com/
          MAX_PER_RUN: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VISUAL_MODEL: nvidia/nemotron-3.5-super-vl:free
          OPENROUTER_VISUAL_FALLBACK_MODEL: google/gemma-4-26b-a4b-it:free
          OPENROUTER_VISUAL_TERTIARY_MODEL: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
          AI_DESIGN: "0"
          BASE_URL: ""
          RESULTS: results/fluff-demo-results.csv
          SITES_DIR: sites

      - name: Capture mobile and desktop screenshots and run quality checks
        run: python review_site.py --site sites/fluff-bake-bar --report-dir review/fluff-bake-bar --business "Fluff Bake Bar" --phone "(713) 522-1900" --source-website https://fluffbakebar.com/
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VISUAL_MODEL: nvidia/nemotron-3.5-super-vl:free
          OPENROUTER_VISUAL_FALLBACK_MODEL: google/gemma-4-26b-a4b-it:free
          OPENROUTER_VISUAL_TERTIARY_MODEL: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free

      - name: Upload generated demo and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluff-bake-bar-demo-review
          path: |
            sites/fluff-bake-bar/index.html
            sites/fluff-bake-bar/img/**
            review/fluff-bake-bar/**
            results/fluff-demo-results.csv
          if-no-files-found: warn
          retention-days: 14
