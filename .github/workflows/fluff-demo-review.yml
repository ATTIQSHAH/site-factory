name: Fluff Bake Bar isolated demo review

on:
  pull_request:
    branches: [main]
    paths:
      - "factory3.py"
      - "artdir.py"
      - "media.py"
      - "render3.py"
      - "templates/**"
      - "review_site.py"
      - "site_quality.py"
      - ".github/workflows/fluff-demo-review.yml"
      - "leads/input.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies and Chromium
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Generate only Fluff Bake Bar
        run: python factory3.py leads/input.csv
        env:
          ONLY_WEBSITE: https://fluffbakebar.com
          MAX_PER_RUN: "1"
          RESULTS: results/fluff-demo-websites.csv
          SITES_DIR: sites
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DESIGN_MODEL: gemini-3.8-flash
          AI_DESIGN: ${{ vars.AI_DESIGN }}
          BASE_URL: ""

      - name: Capture mobile and desktop screenshots and run quality checks
        run: python review_site.py --site sites/fluff-bake-bar --report-dir review/fluff-bake-bar --business "Fluff Bake Bar" --phone "(713) 522-1900" --source-website https://fluffbakebar.com/ --require-hours
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DESIGN_MODEL: gemini-3.8-flash

      - name: Upload generated demo and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluff-bake-bar-demo-review
          path: |
            sites/fluff-bake-bar/index.html
            sites/fluff-bake-bar/img/**
            review/fluff-bake-bar/**
            results/fluff-demo-websites.csv
          if-no-files-found: warn
          retention-days: 14
